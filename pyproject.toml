[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-x-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "astropy>=7,<8",
    "astroquery>=0.4.10,<1",
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "photutils>=2.3,<3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1,<2",
    "reproject>=0.15,<1",
    "scipy>=1.11,<2",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
planet-x-api = "apps.api.main:run"
planet-x-data = "pipeline.ingest:main"

[tool.setuptools.packages.find]
include = ["apps", "apps.api", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
