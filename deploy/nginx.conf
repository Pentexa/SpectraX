# Expensive archive and cube routes share a limit across clients.
map $uri $archive_key {
    default "";
    ~^/api/(archive/|spectrum$|layers(?:/|$)) archive;
}

limit_req_zone $binary_remote_addr zone=client:10m rate=15r/s;
limit_req_zone $archive_key zone=archive:1m rate=5r/s;

server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;
    set $backend http://api:8765;
    client_max_body_size 64k;
    limit_req_status 429;
    error_page 429 = @rate_limited;

    location ~ ^/api/(health|ready)$ {
        proxy_pass $backend;
    }

    location / {
        limit_req zone=client burst=40 nodelay;
        limit_req zone=archive burst=15 nodelay;
        proxy_pass $backend;
        proxy_read_timeout 260s;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"rate_limited","message":"Request limit reached. Retry shortly."}}';
    }
}
