name: SpectraX CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run backend tests
        run: python -m pytest -q -ra

  publish:
    name: Publish backend image
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_ENV"
      - name: Cache public SPHEREx samples
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: data/samples
          key: spherex-v2-${{ hashFiles('data/manifests/spherex-*.json') }}
          restore-keys: |
            spherex-v2-
            spherex-${{ hashFiles('data/manifests/spherex-dr1.json') }}
      - name: Build container
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:sha-$GITHUB_SHA" .
      - name: Verify release tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(docker run --rm "$IMAGE:sha-$GITHUB_SHA" python -c 'from importlib.metadata import version; print(version("planet-x-api"))')
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - name: Download and verify SPHEREx samples
        shell: bash
        run: |
          mkdir -p data/samples
          for attempt in 1 2 3; do
            if docker run --rm --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$PWD/data/samples,dst=/data" \
              "$IMAGE:sha-$GITHUB_SHA" planet-x-data --include-cubes --include-benchmarks; then
              chmod -R a+rX data/samples
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 5; fi
          done
          exit 1
      - name: Test archive import with verified SPHEREx FITS
        run: |
          docker build --target test --tag backend-test .
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            --mount "type=bind,src=$PWD/data/samples,dst=/data,readonly" \
            -e PLANET_X_E2E_SAMPLES=/data \
            backend-test python -m pytest -q -p no:cacheprovider tests/test_archive_e2e.py
      - name: Verify container API
        shell: bash
        run: |
          container=$(docker run --detach --publish 127.0.0.1:8765:8765 \
            --mount "type=bind,src=$PWD/data/samples,dst=/data,readonly" "$IMAGE:sha-$GITHUB_SHA")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          curl --fail --silent --show-error --max-time 2 --retry 20 --retry-all-errors --retry-delay 1 \
            --output "$RUNNER_TEMP/backend-health.json" http://127.0.0.1:8765/api/health
          jq -e '.status == "ok"' "$RUNNER_TEMP/backend-health.json"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8765/openapi.json \
            --output "$RUNNER_TEMP/backend-openapi.json"
          jq -e '.paths | has("/api/compare") and has("/api/spectrum") and has("/api/releases") and has("/api/archive/import") and has("/api/targets/{target_id}/benchmark") and has("/api/source-series") and has("/api/astrometry")' \
            "$RUNNER_TEMP/backend-openapi.json"
          smoke_args=(--wide-sky --benchmarks)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            jq -e --arg version "${GITHUB_REF_NAME#v}" '.info.version == $version' "$RUNNER_TEMP/backend-openapi.json"
            smoke_args+=(--live-archive)
          fi
          python3 -u scripts/smoke_backend.py "${smoke_args[@]}"
      - name: Verify deployment health and request limits
        shell: bash
        run: |
          export SPECTRAX_IMAGE="$IMAGE:sha-$GITHUB_SHA"
          compose=(docker compose -p spectrax-ci -f deploy/compose.yaml)
          trap '"${compose[@]}" logs; "${compose[@]}" down -v' EXIT
          "${compose[@]}" config --quiet
          "${compose[@]}" create prepare-data
          seed=$("${compose[@]}" ps --all --quiet prepare-data)
          docker cp data/samples/. "$seed:/data/"
          "${compose[@]}" up --detach --wait --wait-timeout 90
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/api/ready \
            | jq -e '.status == "ready" and .products == 4'
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError
          from urllib.request import urlopen

          def status(_):
              try:
                  with urlopen("http://127.0.0.1:8080/api/spectrum", timeout=5) as response:
                      return response.status
              except HTTPError as error:
                  return error.code

          with ThreadPoolExecutor(12) as pool:
              codes = set(pool.map(status, range(48)))
          assert codes == {422, 429}, codes
          with urlopen("http://127.0.0.1:8080/api/ready", timeout=5) as response:
              assert response.status == 200
          PY
      - name: Push image to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            docker push "$IMAGE:sha-$GITHUB_SHA"
          fi
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          printf 'Published `%s:%s`.\n' "$IMAGE" "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Publish versioned release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not' | grep -qx true; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "SpectraX Backend $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
